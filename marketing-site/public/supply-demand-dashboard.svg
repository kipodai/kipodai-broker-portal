<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Supply and demand outlook dashboard</title><desc id="desc">A crisp dashboard showing supplier shipments, retailer sell-through, and variance over twelve periods.</desc>
